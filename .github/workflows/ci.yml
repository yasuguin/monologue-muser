name: CI

on:
  push:
    branches: [main]
  pull_request:
  # secret の値だけを変えたときなど、コードを変えずにデプロイし直すとき
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # setup-uv は major の floating tag を公開しないため完全な版で指定する
        with:
          enable-cache: true
          # requirements の同期テストは uv export の出力と完全一致を取るため、手元と同じ uv に揃える
          version: "0.10.2"
      # uv.lock と pyproject.toml がずれていれば失敗させる
      - run: uv sync --locked
      - run: uv run ruff check .
      # 各サービスの main.py はモジュール名が衝突するため、pytest はサービス単位で回す
      - run: uv run pytest monologue-uploader
      - run: uv run pytest monologue-summarizer
      - run: uv run pytest monologue-notifier
      # cloudbuild.yaml のデプロイ設定がコードの読む環境変数と一致するか
      - run: uv run pytest tests

  deploy:
    needs: test
    # public の repo にも publish.sh でこのファイルが書き出されるので、作業場の repo の main に限る。
    # 値ファイル private/deploy/deploy.env は作業場にしか無い。
    if: >-
      github.repository == 'yasu-888/monologue-muser-dev' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # WIF に必須。無いと OIDC token が発行されない
    # 連続 push でデプロイが重ならないよう順番に流す。途中のデプロイは止めない。
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: private/deploy/submit.sh
